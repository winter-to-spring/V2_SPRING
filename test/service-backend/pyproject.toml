[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "service-backend"
version = "0.1.0"
description = "FastAPI-based service backend with async database support"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Development Team"}
]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "asyncpg",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "httpx",
    "redis",
    "langgraph",
    "langchain-openai",
    "sse-starlette",
    "python-multipart",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pytest-mock",
]

[project.urls]
Homepage = "https://github.com/example/service-backend"
Documentation = "https://docs.example.com"
Repository = "https://github.com/example/service-backend.git"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
