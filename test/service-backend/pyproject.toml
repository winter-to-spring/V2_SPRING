[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "service-backend"
version = "0.1.0"
description = "Service backend with FastAPI, SQLAlchemy, and LangGraph integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Development Team"}]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
    "pgvector>=0.2.0",
    "redis>=5.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "slack-sdk>=3.27.0",
    "langgraph>=0.0.1",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.1",
    "sse-starlette>=1.6.0",
    "python-multipart>=0.0.6",
    "structlog>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
