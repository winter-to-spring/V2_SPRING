name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Compile source tree
        run: python -m compileall src

      - name: Run tests
        run: PYTHONPATH=src pytest -q

      - name: CLI help smoke
        run: python -m v2_spring.cli --help

      - name: Tracer bullet smoke
        shell: bash
        run: |
          export DATABASE_URL="sqlite+pysqlite:///./.github-ci.db"
          RUN_ID="$(v2-spring run create \
            --project demo \
            --goal 'GitHub Actions tracer bullet smoke' \
            --urgency normal \
            --risk low | awk 'NR==1 {print $3}')"
          v2-spring run show "${RUN_ID}"
