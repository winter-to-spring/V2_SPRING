[project]
name = "v2-spring"
version = "0.1.0"
description = "Clean-room autonomous studio control plane."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph",
  "openai>=1.75",
  "pydantic>=2.11",
  "python-dotenv",
  "psycopg[binary]",
  "redis",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
  "alembic>=1.14",
  "pytest>=8.3",
]

[project.scripts]
v2-spring = "v2_spring.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
